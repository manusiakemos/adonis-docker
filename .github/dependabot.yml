version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/docker/mysql"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-docker-mysql-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/docker/nginx"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-docker-nginx-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/docker/redis"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-docker-redis-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5